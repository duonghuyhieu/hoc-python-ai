name: Kiểm code theo video
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"        # thứ Hai hằng tuần: bắt sớm nếu môi trường đổi
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cài torch (bản CPU) nếu đã có bài dùng torch
        run: |
          if grep -rqlE '^\s*(import|from) torch' ngay-*/ 2>/dev/null; then
            pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
          fi
      - name: Chạy mọi file như học viên, so với README
        run: python tools/kiem.py
